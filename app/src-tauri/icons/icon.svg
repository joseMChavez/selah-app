<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Icono de EmetPro: una E hecha de tres renglones de una página; el del medio, dorado, es la palabra
       que se muestra en pantalla. «Emet» (אמת) es «verdad, fidelidad» en hebreo.
       Plano y en tres tintas (azul noche, crema, dorado) para leerse incluso a 16 px.
       Fuente de todos los tamaños: npx tauri icon (ver docs/RELEASES.md). -->
  <circle cx="512" cy="512" r="496" fill="#1c3b7a"/>
  <rect x="300" y="262" width="120" height="500" rx="40" fill="#f6efe0"/>
  <rect x="300" y="262" width="430" height="120" rx="60" fill="#f6efe0"/>
  <rect x="300" y="642" width="430" height="120" rx="60" fill="#f6efe0"/>
  <rect x="460" y="452" width="270" height="120" rx="60" fill="#f2b84b"/>
</svg>
