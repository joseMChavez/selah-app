# Instaladores de EmetPro para Linux, Windows y macOS.
# - Al subir una etiqueta vX.Y.Z: compila los tres sistemas y deja un borrador en Releases.
# - A mano (Actions → Instaladores → Run workflow): compila y deja los archivos como artefactos.
# Las Biblias XML no están en git, así que estos instaladores salen sin Biblias (ver D-013).
name: Instaladores

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux
            args: ""
          - platform: windows-latest
            name: windows
            args: ""
          - platform: macos-latest
            name: macos
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      # La versión de los instaladores sale de la etiqueta (v0.2.1 → 0.2.1), sin tocar los archivos a mano.
      - name: Versión desde la etiqueta
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME debe tener la forma vX.Y.Z"
            exit 1
          fi
          node -e "
            const fs = require('fs'), f = 'app/src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(f, 'utf8'));
            conf.version = process.argv[1];
            fs.writeFileSync(f, JSON.stringify(conf, null, 2) + '\n');
          " "$version"
          echo "Versión de los instaladores: $version"

      - name: Dependencias de Linux
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          # Sin libgstreamer1.0-dev: en ubuntu-22.04 choca con libunwind (v0.2.2). Basta con los plugins.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Dependencias de la interfaz
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          # Sin etiqueta (ejecución a mano) solo compila; con etiqueta sube al borrador de la versión.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: EmetPro ${{ github.ref_name }}
          releaseBody: |
            Pre-release. The installers are not signed, so Windows and macOS will show a warning the first time you open them.
            Bibles are not included: import them from EmetPro (Beblia XML format).
            EmetPro was called Selah up to 0.8.2. Install this version and open it once: it copies your Selah data (Bibles, lyrics, plans, media, settings). Then you can uninstall Selah.
          releaseDraft: true
          prerelease: true

      - name: Guardar los instaladores como artefacto
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: emetpro-${{ matrix.name }}
          path: |
            app/src-tauri/target/release/bundle/
            app/src-tauri/target/universal-apple-darwin/release/bundle/
          if-no-files-found: error
